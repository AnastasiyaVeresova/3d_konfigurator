<script>
let scene, camera, renderer, controls;
const sceneObjects = [];
const loader = new THREE.GLTFLoader();
const modelsPaths = {
  straight: 'models/straight_section.glb',
  corner: 'models/corner_section.glb'
};

// Кэш текстур
const textureCache = {};
const textureLoader = new THREE.TextureLoader();

let backgroundPlane = null;
const bgTextureLoader = new THREE.TextureLoader();

// Переменные для трансформации фона
let bgScale = 1.0;
let bgOffsetX = 0;
let bgOffsetZ = 0;


let modelsCache = {};
let modelsLoaded = false;
let modelsToLoad = Object.keys(modelsPaths).length;
let modelsLoadedCount = 0;

let selectedObject = null;
let transformControls;
let currentObject = null;
let currentXPosition = 0;
const SNAP_THRESHOLD = 3.0;
let isDragging = false;

const objectControlsDiv = document.getElementById('object-controls');
const rotYSlider = document.getElementById('rotation-y-slider');
const posYSlider = document.getElementById('position-y-slider');

// ===================================================
// ИСТОРИЯ ДЕЙСТВИЙ
// ===================================================
const historyStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

function saveState() {
  redoStack.length = 0;

  const snapshot = [];
  sceneObjects.forEach(obj => {
    const clone = obj.clone(true);
    if (obj.userData) {
      clone.userData = JSON.parse(JSON.stringify(obj.userData));
    }
    snapshot.push(clone);
  });

  historyStack.push(snapshot);

  if (historyStack.length > MAX_HISTORY) {
    historyStack.shift();
  }

  updateHistoryButtons();
}

function undo() {
  if (historyStack.length < 2) return;

  const currentSnapshot = historyStack.pop();
  const prevSnapshot = historyStack[historyStack.length - 1];

  redoStack.push(currentSnapshot);

  restoreSnapshot(prevSnapshot);
  updateHistoryButtons();
}

function redo() {
  if (redoStack.length === 0) return;

  const nextSnapshot = redoStack.pop();
  historyStack.push(nextSnapshot);

  restoreSnapshot(nextSnapshot);
  updateHistoryButtons();
}

function restoreSnapshot(snapshot) {
  sceneObjects.forEach(obj => scene.remove(obj));
  sceneObjects.length = 0;

  snapshot.forEach(obj => {
    scene.add(obj);
    sceneObjects.push(obj);

    // Восстанавливаем текстуры, т.к. clone() не копирует ссылки на текстуры
    if (obj.userData.upholsteryCategory && obj.userData.upholsteryCategory !== 'none') {
      applyUpholsteryTexture(obj, obj.userData.upholsteryCategory, obj.userData.upholsteryVariant);
    }
          buildDimensions(obj);

  });
  buildTotalDimensions();
  deselectObject();
}


function updateHistoryButtons() {
  const btnUndo = document.getElementById('undo-action');
  const btnRedo = document.getElementById('redo-action');

  if (btnUndo) btnUndo.classList.toggle('disabled-btn', historyStack.length <= 1);
  if (btnRedo) btnRedo.classList.toggle('disabled-btn', redoStack.length === 0);
}

// ===================================================
// УТИЛИТЫ
// ===================================================
function hexStringToNumber(hexStr) {
  return parseInt(hexStr.slice(1), 16);
}

const COLOR_TYPE_RULES = [
  { type: 'upholstery', colors: [0x696969, 0x232323, 0x242424] },  //0x393939
  { type: 'frame', colors: [0x979797, 0xCACACA] },
];

function assignMeshTypes(model) {
  const colorMap = {};

  model.traverse((child) => {
    if (child.isMesh) {
      if (!child.userData) child.userData = {};
      const colorHex = child.material.color.getHex();
      child.userData.originalColor = colorHex;
      child.userData.hasOriginalTexture = !!child.material.map;

      // Поворачиваем встроенную текстуру
      if (child.userData.hasOriginalTexture) {
        const tex = child.material.map;
        tex.center.set(0.5, 0.5);
        tex.rotation = THREE.MathUtils.degToRad(0); // угол поворота
        tex.repeat.set(2, 2);
        // Смещение текстуры 
        // tex.offset.x = 0.1;   // сдвиг по горизонтали
        // tex.offset.y = -0.05;  // сдвиг по вертикали
        tex.needsUpdate = true;
      }

      const colorStr = '0x' + colorHex.toString(16).toUpperCase().padStart(6, '0');
      const meshName = child.name || '(без имени)';
      const hasTex = child.material.map ? ' [с текстурой]' : '';
      if (!colorMap[colorStr]) colorMap[colorStr] = { count: 0, meshes: [] };
      colorMap[colorStr].count++;
      colorMap[colorStr].meshes.push(meshName + hasTex);

      let found = false;
      for (const rule of COLOR_TYPE_RULES) {
        if (rule.colors.includes(colorHex)) {
          child.userData.type = rule.type;
          found = true;
          break;
        }
      }
      if (!found) child.userData.type = 'undefined';
    }
  });

  const report = {};
  for (const [color, data] of Object.entries(colorMap)) {
    report[color] = `${data.count} мешей: ${data.meshes.join(', ')}`;
  }
  console.log('🎨 Базовые цвета модели:', report);
}



function changeColorByType(model, type, colorHex) {
  let changedCount = 0;
  model.traverse((child) => {
    if (child.isMesh && child.userData && child.userData.type === type) {
      child.material = child.material.clone();
      // if (child.material.map) child.material.map = null;
      child.material.color.setHex(colorHex);
      child.material.metalness = 0;
      child.material.roughness = 0.7;
      child.material.needsUpdate = true;
      changedCount++;
    }
  });
  return changedCount;
}

function updateColorForAllSceneObjects(type, colorHex) {
  sceneObjects.forEach((obj) => {
    changeColorByType(obj, type, colorHex);
  });
}

// ===================================================
// ВЫДЕЛЕНИЕ ОБЪЕКТА
// ===================================================
function highlightObject(object, on) {
  object.traverse((child) => {
    if (child.isMesh) {
      if (on) {
        if (child.userData.origEmissive === undefined) {
          child.userData.origEmissive = child.material.emissive
            ? child.material.emissive.getHex()
            : 0x000000;
        }
        child.material.emissive = new THREE.Color(0x004400);
        child.material.emissiveIntensity = 0.5;
      } else {
        if (child.userData.origEmissive !== undefined) {
          child.material.emissive = new THREE.Color(child.userData.origEmissive);
          child.material.emissiveIntensity = 1;
        }
      }
      child.material.needsUpdate = true;
    }
  });
}

function selectObject(object) {
  if (selectedObject) {
    highlightObject(selectedObject, false);
  }
  selectedObject = object;
  currentObject = object;

  if (object.userData.frameColor) {
    document.getElementById('frame-color').value = object.userData.frameColor;
  }
  if (object.userData.upholsteryColor) {
    document.getElementById('upholstery-color').value = object.userData.upholsteryColor;
  }

  // Восстанавливаем категорию и вариант текстуры
if (object.userData.upholsteryCategory) {
  document.getElementById('upholstery-category').value = object.userData.upholsteryCategory;
  populateVariants();
  if (object.userData.upholsteryVariant) {
    setSelectedVariantFile(object.userData.upholsteryVariant);
  }
}


  highlightObject(object, true);
  transformControls.attach(object);
  setMode('translate');
  updateSliders();
  objectControlsDiv.style.display = 'contents';
}

function deselectObject() {
  if (selectedObject) {
    highlightObject(selectedObject, false);
  }
  selectedObject = null;
  currentObject = null;
  objectControlsDiv.style.display = 'none';
  if (transformControls) transformControls.detach();
}

function setMode(mode) {
  if (transformControls) {
    transformControls.setMode(mode);
  }
}

function updateSliders() {
  if (currentObject) {
    const rotDeg = THREE.MathUtils.radToDeg(currentObject.rotation.y).toFixed(0);
    const posY = currentObject.position.y.toFixed(2);
    rotYSlider.value = rotDeg;
    posYSlider.value = posY;
    document.getElementById('rotation-y-input').value = rotDeg;
    document.getElementById('position-y-input').value = posY;
  }
}


// ===================================================
// ЗАГРУЗКА МОДЕЛЕЙ
// ===================================================
function loadModels() {
  const keys = Object.keys(modelsPaths);
  let loadedCount = 0;

  keys.forEach(key => {
    new THREE.GLTFLoader().load(modelsPaths[key], (gltf) => {
      const sceneModel = gltf.scene;
      assignMeshTypes(sceneModel);
      modelsCache[key] = sceneModel;
      loadedCount++;
      if (loadedCount === keys.length) {
        modelsLoaded = true;
        console.log('✅ Все модели загружены');
        saveState();
      }
    }, undefined, (error) => console.error('Ошибка загрузки модели:', key, error));
  });
}

// ===================================================
// ДОБАВЛЕНИЕ СЕКЦИИ
// ===================================================
function addSection(type) {
  if (!modelsLoaded) {
    alert('Модели ещё не загружены, подождите.');
    return;
  }

  saveState();

  if (!modelsCache[type]) {
    alert('Модель не загрузилась: ' + type);
    return;
  }

  const model = modelsCache[type].clone(true);

model.traverse((child) => {
    if (child.isMesh) {
      child.material = child.material.clone();

      // Сохраняем текстуру, если она была
      if (!child.userData.hasOriginalTexture) {
        if (child.material.map) child.material.map = null;
      }
      if (child.material.normalMap) child.material.normalMap = null;
      if (child.material.roughnessMap) child.material.roughnessMap = null;
      if (child.material.metalnessMap) child.material.metalnessMap = null;

      // Меняем цвет только если нет текстуры
      if (!child.userData.hasOriginalTexture) {
        child.material.color.setHex(0xffffff);
      }
      child.material.metalness = 0;
      child.material.roughness = 0.7;
      child.material.emissive = new THREE.Color(0x000000);
      child.material.needsUpdate = true;
      child.userData.originalColor = child.material.color.getHex();
    }
  });


  model.scale.set(10, 10, 10);
  model.traverse((child) => {
  if (child.isMesh) {
    child.castShadow = true;
  }
});


  const group = new THREE.Group();
  group.add(model);
  group.position.set(currentXPosition, 0, 0);

  const frameHexStr = document.getElementById('frame-color').value;
  const upholsteryHexStr = document.getElementById('upholstery-color').value;
  const upholsteryCat = document.getElementById('upholstery-category').value;
const upholsteryVariant = getSelectedVariantFile();

  group.userData = {
    type: type,
    frameColor: frameHexStr,
    upholsteryColor: upholsteryHexStr,
    upholsteryCategory: upholsteryCat,
    upholsteryVariant: upholsteryVariant || ''
  };

  changeColorByType(group, 'frame', hexStringToNumber(frameHexStr));
  changeColorByType(group, 'upholstery', hexStringToNumber(upholsteryHexStr));

  if (upholsteryCat !== 'none' && upholsteryVariant) {
    applyUpholsteryTexture(group, upholsteryCat, upholsteryVariant);
  }


  scene.add(group);
  sceneObjects.push(group);
  buildDimensions(group);
  currentXPosition += 10;

  buildTotalDimensions();
}


// ===================================================
// КЛИК ПО СЦЕНЕ
// ===================================================
function onMouseClick(event) {
  if (event.target.closest('#ui-panel') || event.target.closest('#object-controls')) return;

  const mouse = new THREE.Vector2(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(sceneObjects, true);

  if (intersects.length > 0) {
    let object = intersects[0].object;
    while (object.parent && !sceneObjects.includes(object)) {
      object = object.parent;
    }
    if (object !== selectedObject) {
      deselectObject();
      selectObject(object);
    }
  } else {
    deselectObject();
  }
}

// ===================================================
// ЭКСПОРТ
// ===================================================
function exportScene() {
  deselectObject();
  const exporter = new THREE.GLTFExporter();
  exporter.parse(scene, (result) => {
    const output = JSON.stringify(result, null, 2);
    const blob = new Blob([output], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scene.gltf';
    a.click();
    URL.revokeObjectURL(url);
  }, { binary: false });
}

// ===================================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ИСТОРИИ
// ===================================================
// Bounding box БЕЗ размерных линий
function getObjBox(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const v = new THREE.Vector3();
  obj.children.forEach(child => {
    if (child.name === 'dimension-group') return;
    child.traverse(mesh => {
      if (mesh.isMesh && mesh.geometry) {
        if (mesh.geometry.boundingBox === null) mesh.geometry.computeBoundingBox();
        const bb = mesh.geometry.boundingBox;
        if (bb) {
          v.copy(bb.min); mesh.localToWorld(v); box.expandByPoint(v);
          v.copy(bb.max); mesh.localToWorld(v); box.expandByPoint(v);
        }
      }
    });
  });
  return box;
}

function getNominalObjBox(obj) {
  const type = obj.userData.type;
  const dims = modelDimensions[type];
  if (!dims) return new THREE.Box3();

  const realBox = getObjBox(obj);
  if (realBox.isEmpty()) return new THREE.Box3();

  const rotY = obj.rotation.y;
  const isRotated = Math.abs(Math.round(rotY / (Math.PI / 2)) % 2) === 1;
  const nw = (isRotated ? dims.depth : dims.width) / 100;
  const nd = (isRotated ? dims.width : dims.depth) / 100;
  const nh = dims.height / 100;

  const center = new THREE.Vector3();
  realBox.getCenter(center);

  return new THREE.Box3(
    new THREE.Vector3(center.x - nw / 2, realBox.min.y, center.z - nd / 2),
    new THREE.Vector3(center.x + nw / 2, realBox.min.y + nh, center.z + nd / 2)
  );
}


function snapToNeighbors(draggedObj) {
  if (!draggedObj) return;

  draggedObj.updateMatrixWorld(true);
  const draggedBox = getObjBox(draggedObj);

  const innerBox = draggedBox.clone();
  innerBox.min.x += COLLISION_PADDING;
  innerBox.max.x -= COLLISION_PADDING;
  innerBox.min.z += COLLISION_PADDING;
  innerBox.max.z -= COLLISION_PADDING;

  if (innerBox.min.x >= innerBox.max.x) innerBox.min.x = draggedBox.min.x;
  if (innerBox.min.z >= innerBox.max.z) innerBox.min.z = draggedBox.min.z;

  // --- Фаза 1: Выталкивание ---
  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);

    const objBox = getObjBox(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING; objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING; objInnerBox.max.z -= COLLISION_PADDING;

    const xOv = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    const zOv = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;

    if (xOv && zOv) {
      const pushR = objInnerBox.max.x - innerBox.min.x;
      const pushL = innerBox.max.x - objInnerBox.min.x;
      const pushF = objInnerBox.max.z - innerBox.min.z;
      const pushB = innerBox.max.z - objInnerBox.min.z;
      const minPush = Math.min(pushR, pushL, pushF, pushB);

      if (minPush === pushR)      draggedObj.position.x += pushR;
      else if (minPush === pushL) draggedObj.position.x -= pushL;
      else if (minPush === pushF) draggedObj.position.z += pushF;
      else                        draggedObj.position.z -= pushB;

      draggedObj.updateMatrixWorld(true);
      innerBox.copy(getObjBox(draggedObj));
      innerBox.min.x += COLLISION_PADDING; innerBox.max.x -= COLLISION_PADDING;
      innerBox.min.z += COLLISION_PADDING; innerBox.max.z -= COLLISION_PADDING;
    }
  });

  // --- Фаза 2: Притяжение по грани ---
  let snapX = null, snapZ = null;
  let minDistX = SNAP_THRESHOLD, minDistZ = SNAP_THRESHOLD;

  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);

    const objBox = getObjBox(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING; objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING; objInnerBox.max.z -= COLLISION_PADDING;

    const zOverlap = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;
    if (zOverlap) {
      const gap1 = objInnerBox.min.x - innerBox.max.x;
      if (gap1 >= 0 && gap1 < minDistX) { minDistX = gap1; snapX = draggedObj.position.x + gap1; }
      const gap2 = innerBox.min.x - objInnerBox.max.x;
      if (gap2 >= 0 && gap2 < minDistX) { minDistX = gap2; snapX = draggedObj.position.x - gap2; }
    }

    const xOverlap = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    if (xOverlap) {
      const gap3 = objInnerBox.min.z - innerBox.max.z;
      if (gap3 >= 0 && gap3 < minDistZ) { minDistZ = gap3; snapZ = draggedObj.position.z + gap3; }
      const gap4 = innerBox.min.z - objInnerBox.max.z;
      if (gap4 >= 0 && gap4 < minDistZ) { minDistZ = gap4; snapZ = draggedObj.position.z - gap4; }
    }
  });

  if (snapX !== null) {
    draggedObj.position.x = snapX;
    draggedObj.updateMatrixWorld(true);
    innerBox.copy(getObjBox(draggedObj));
    innerBox.min.x += COLLISION_PADDING; innerBox.max.x -= COLLISION_PADDING;
    innerBox.min.z += COLLISION_PADDING; innerBox.max.z -= COLLISION_PADDING;
  }
  if (snapZ !== null) {
    draggedObj.position.z = snapZ;
    draggedObj.updateMatrixWorld(true);
    innerBox.copy(getObjBox(draggedObj));
    innerBox.min.x += COLLISION_PADDING; innerBox.max.x -= COLLISION_PADDING;
    innerBox.min.z += COLLISION_PADDING; innerBox.max.z -= COLLISION_PADDING;
  }

  // --- Фаза 3: Притяжение углов ---
  const CORNER_THRESHOLD = SNAP_THRESHOLD;
  let bestCornerDist = CORNER_THRESHOLD;
  let cornerDx = 0, cornerDz = 0;

  const draggedCorners = [
    { x: innerBox.min.x, z: innerBox.min.z },
    { x: innerBox.max.x, z: innerBox.min.z },
    { x: innerBox.min.x, z: innerBox.max.z },
    { x: innerBox.max.x, z: innerBox.max.z }
  ];

  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);
    const objBox = getObjBox(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING; objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING; objInnerBox.max.z -= COLLISION_PADDING;

    const hasXOverlap = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    const hasZOverlap = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;
    if (hasXOverlap && hasZOverlap) return;

    const objCorners = [
      { x: objInnerBox.min.x, z: objInnerBox.min.z },
      { x: objInnerBox.max.x, z: objInnerBox.min.z },
      { x: objInnerBox.min.x, z: objInnerBox.max.z },
      { x: objInnerBox.max.x, z: objInnerBox.max.z }
    ];

    draggedCorners.forEach(dc => {
      objCorners.forEach(oc => {
        const dx = oc.x - dc.x;
        const dz = oc.z - dc.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist > 0.01 && dist < bestCornerDist) {
          bestCornerDist = dist; cornerDx = dx; cornerDz = dz;
        }
      });
    });
  });

  if (bestCornerDist < CORNER_THRESHOLD) {
    draggedObj.position.x += cornerDx;
    draggedObj.position.z += cornerDz;
  }
}



function capturePositions() {
  const positions = {};
  sceneObjects.forEach((obj, i) => {
    positions[i] = {
      x: obj.position.x, y: obj.position.y, z: obj.position.z,
      rx: obj.rotation.x, ry: obj.rotation.y, rz: obj.rotation.z
    };
  });
  return positions;
}

function positionsChanged(beforeState) {
  let changed = false;
  sceneObjects.forEach((obj, i) => {
    const b = beforeState[i];
    if (!b) { changed = true; return; }
    if (obj.position.x !== b.x || obj.position.y !== b.y || obj.position.z !== b.z ||
        obj.rotation.x !== b.rx || obj.rotation.y !== b.ry || obj.rotation.z !== b.rz) {
      changed = true;
    }
  });
  return changed;
}

function exportPNG() {
  deselectObject();

  // Желаемое разрешение картинки
  const EXPORT_W = 3840;
  const EXPORT_H = 2160;

  // Сохраняем оригинальные размеры
  const origW = renderer.domElement.width;
  const origH = renderer.domElement.height;
  const origAspect = camera.aspect;

  // Сохраняем состояние фона
  const wasBackgroundPlane = backgroundPlane !== null;
  let tempBgColor = null;

  if (wasBackgroundPlane) {
    scene.remove(backgroundPlane);
  } else {
    tempBgColor = scene.background;
    scene.background = null;
  }

  // Убираем пол
  const floor = scene.children.find(c => c.geometry && c.geometry.type === 'PlaneGeometry');
  let floorVisible = null;
  if (floor) {
    floorVisible = floor.visible;
    floor.visible = false;
  }

  // Меняем размер рендерера
  renderer.setSize(EXPORT_W, EXPORT_H, false);
  camera.aspect = EXPORT_W / EXPORT_H;
  camera.updateProjectionMatrix();

  // Рендерим в новом разрешении
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');

  // Восстанавливаем рендерер
  renderer.setSize(window.innerWidth, window.innerHeight, true);
  camera.aspect = origAspect;
  camera.updateProjectionMatrix();

  // Восстанавливаем фон
  if (wasBackgroundPlane) {
    scene.add(backgroundPlane);
  } else if (tempBgColor) {
    scene.background = tempBgColor;
  }

  if (floor) floor.visible = floorVisible;

  // Скачиваем
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'sofa-config.png';

// Кэш: key = "category/file" -> THREE.Texture
const upholsteryTextureCache = {};

function getUpholsteryTextureKey(category, file) {
  return category + '/' + file;
}

function loadUpholsteryTexture(category, file, onLoad) {
  const key = getUpholsteryTextureKey(category, file);
  if (upholsteryTextureCache[key]) {
    onLoad(upholsteryTextureCache[key]);
    return;
  }

  textureLoader.load(file, (tex) => {
    // 1. Включаем повторение
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;

    //     tex.wrapS = THREE.MirroredRepeatWrapping;
    // tex.wrapT = THREE.MirroredRepeatWrapping;

    
    // 2. Увеличиваем повтор (рисунок мельче)
    tex.repeat.set(25, 25); 

    // 3. ГЛАВНОЕ: Размываем края текстуры, чтобы скрыть швы
    blurTextureEdges(tex, 20); // 10px - ширина размытия (от 5 до 20)

    // 4. Настройки для четкости и сглаживания
    // tex.encoding = THREE.sRGBEncoding;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter; // Фильтр для повторов
    tex.magFilter = THREE.LinearFilter;            // Сглаживание при увеличении
    tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 16; // Четкость под углом

    upholsteryTextureCache[key] = tex;
    console.log('✅ Текстура загружена и обработана:', key);
    onLoad(tex);
  }, undefined, (err) => {
    console.warn('⚠️ Ошибка загрузки текстуры:', file);
    // Создаем серую заглушку с шумом, тоже с размытием
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 500; i++) {
      const x = Math.random() * 256; const y = Math.random() * 256;
      ctx.fillStyle = `rgb(180,180,180)`; ctx.fillRect(x, y, 4, 4);
    }
    const fallback = new THREE.CanvasTexture(canvas);
    fallback.wrapS = THREE.RepeatWrapping; fallback.wrapT = THREE.RepeatWrapping;
    fallback.repeat.set(20, 20);
    blurTextureEdges(fallback, 10); // Применяем размытие и к заглушке
    fallback.generateMipmaps = true; fallback.minFilter = THREE.LinearMipmapLinearFilter;
    upholsteryTextureCache[key] = fallback;
    onLoad(fallback);
  });
}

function blurTextureEdges(texture, pixelRadius = 40) {
  const img = texture.image;
  if (!img) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  // Используем реальные размеры картинки
  canvas.width = img.width || img.naturalWidth || 256;
  canvas.height = img.height || img.naturalHeight || 256;
  
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  let imageData;
  try {
    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } catch (e) {
    console.warn('⚠️ Не удалось обработать текстуру (CORS):', e);
    return;
  }

  const src = new Uint8ClampedArray(imageData.data);
  const d = imageData.data;
  const w = canvas.width;
  const h = canvas.height;

  // Smoothstep для плавного перехода вместо линейного
  function smoothstep(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
  }

  // --- Горизонтальная склейка: левый край ↔ правый край ---
  for (let y = 0; y < h; y++) {
    // Левый край (от 0 до pixelRadius)
    for (let x = 0; x < pixelRadius && x < w; x++) {
      const idx = (y * w + x) * 4;
      const mirrorX = w - 1 - x;
      const mIdx = (y * w + mirrorX) * 4;
      // t = 0 у края, 1 в центре зоны перехода
      const t = 1 - smoothstep(x / pixelRadius);

      d[idx]     = src[idx]     * (1 - t) + src[mIdx]     * t;
      d[idx + 1] = src[idx + 1] * (1 - t) + src[mIdx + 1] * t;
      d[idx + 2] = src[idx + 2] * (1 - t) + src[mIdx + 2] * t;
    }

    // Правый край (от w - pixelRadius до w)
    for (let x = w - pixelRadius; x < w; x++) {
      if (x < pixelRadius) continue; // Чтобы не дублировать обработку центральной зоны
      const idx = (y * w + x) * 4;
      const mirrorX = w - 1 - x;
      const mIdx = (y * w + mirrorX) * 4;
      const t = 1 - smoothstep((w - 1 - x) / pixelRadius);

      d[idx]     = src[idx]     * (1 - t) + src[mIdx]     * t;
      d[idx + 1] = src[idx + 1] * (1 - t) + src[mIdx + 1] * t;
      d[idx + 2] = src[idx + 2] * (1 - t) + src[mIdx + 2] * t;
    }
  }

  // Сохраняем промежуточный результат, чтобы вертикальный проход не смешивал уже смешанные пиксели
  const src2 = new Uint8ClampedArray(d);

  // --- Вертикальная склейка: верхний край ↔ нижний край ---
  for (let x = 0; x < w; x++) {
    // Верхний край
    for (let y = 0; y < pixelRadius && y < h; y++) {
      const idx = (y * w + x) * 4;
      const mirrorY = h - 1 - y;
      const mIdx = (mirrorY * w + x) * 4;
      const t = 1 - smoothstep(y / pixelRadius);

      d[idx]     = src2[idx]     * (1 - t) + src2[mIdx]     * t;
      d[idx + 1] = src2[idx + 1] * (1 - t) + src2[mIdx + 1] * t;
      d[idx + 2] = src2[idx + 2] * (1 - t) + src2[mIdx + 2] * t;
    }

    // Нижний край
    for (let y = h - pixelRadius; y < h; y++) {
      if (y < pixelRadius) continue;
      const idx = (y * w + x) * 4;
      const mirrorY = h - 1 - y;
      const mIdx = (mirrorY * w + x) * 4;
      const t = 1 - smoothstep((h - 1 - y) / pixelRadius);

      d[idx]     = src2[idx]     * (1 - t) + src2[mIdx]     * t;
      d[idx + 1] = src2[idx + 1] * (1 - t) + src2[mIdx + 1] * t;
      d[idx + 2] = src2[idx + 2] * (1 - t) + src2[mIdx + 2] * t;
    }
  }

  ctx.putImageData(imageData, 0, 0);
  texture.image = canvas;
  texture.needsUpdate = true;
}


// Применить текстуру на обивку объекта
function applyUpholsteryTexture(object, category, file) {
  if (category === 'none' || !file) {
    object.traverse((child) => {
      if (child.isMesh && child.userData && child.userData.type === 'upholstery') {
        child.material.map = null;
        child.material.needsUpdate = true;
      }
    });
    return;
  }

  loadUpholsteryTexture(category, file, (texture) => {
    object.traverse((child) => {
      if (child.isMesh && child.userData && child.userData.type === 'upholstery') {
        child.material.map = texture;
        child.material.needsUpdate = true;
      }
    });
  });
}

// Применить текстуру ко всем объектам сцены
function applyUpholsteryTextureToAll(category, file) {
  sceneObjects.forEach(obj => applyUpholsteryTexture(obj, category, file));
}

function populateVariants() {
  const categorySelect = document.getElementById('upholstery-category');
  const grid = document.getElementById('variant-grid');

  const cat = categorySelect.value;
  grid.innerHTML = '';

  if (cat === 'none') {
    grid.style.display = 'none';
    return;
  }

  const data = upholsteryCatalog[cat];
  if (!data) { grid.style.display = 'none'; return; }

  grid.style.display = 'grid';

  data.textures.forEach((tex) => {
    const circle = document.createElement('div');
    circle.className = 'variant-circle';
    circle.style.backgroundImage = `url('${tex.file}')`;
    circle.dataset.file = tex.file;
    circle.setAttribute('data-tooltip', tex.name);
    grid.appendChild(circle);
  });

  // Автовыбор первого варианта
  if (data.textures.length > 0) {
    setSelectedVariantFile(data.textures[0].file);
  }
}

function setSelectedVariantFile(file) {
  const grid = document.getElementById('variant-grid');
  let found = false;
  grid.querySelectorAll('.variant-circle').forEach(el => {
    if (el.dataset.file === file) {
      el.classList.add('active');
      found = true;
    } else {
      el.classList.remove('active');
    }
  });
  return found;
}

function getSelectedVariantFile() {
  const active = document.querySelector('.variant-circle.active');
  return active ? active.dataset.file : '';
}

// Обработка клика по кружку варианта
document.getElementById('variant-grid').addEventListener('click', (e) => {
  const circle = e.target.closest('.variant-circle');
  if (!circle) return;

  setSelectedVariantFile(circle.dataset.file);

  const cat = document.getElementById('upholstery-category').value;
  const file = circle.dataset.file;

  saveState();

  if (selectedObject) {
    applyUpholsteryTexture(selectedObject, cat, file);
    selectedObject.userData.upholsteryCategory = cat;
    selectedObject.userData.upholsteryVariant = file;
  } else {
    applyUpholsteryTextureToAll(cat, file);
    sceneObjects.forEach(obj => {
      if (obj.userData) {
        obj.userData.upholsteryCategory = cat;
        obj.userData.upholsteryVariant = file;
      }
    });
  }
});

function updateUpholsteryPreview() {
  const variantSelect = document.getElementById('upholstery-variant');
  const preview = document.getElementById('upholstery-preview');
  const file = variantSelect.value;

  if (file) {
    preview.src = file;
    preview.style.display = 'block';
    preview.onerror = () => { preview.style.display = 'none'; };
  } else {
    preview.style.display = 'none';
  }
}

const modelDimensions = {
  straight: { width: 650, depth: 650,  height: 710 },
  corner:   { width: 650, depth: 650, height: 710 }
};

let dimensionsVisible = false;

function makeDimLine(p1, p2, color) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  const mat = new THREE.LineBasicMaterial({
    color: color, depthTest: false, transparent: true
  });
  const line = new THREE.Line(geo, mat);
  line.renderOrder = 999;
  line.raycast = () => {};
  return line;
}

function makeDimLabel(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 120;
  canvas.height = 40;
  const ctx = canvas.getContext('2d');

  // Белый текст, без фона
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    depthTest: false,
    depthWrite: false,
    transparent: true
  });

  const spr = new THREE.Sprite(mat);
  spr.scale.set(3, 1, 1);

  spr.renderOrder = 999;
  spr.raycast = () => {};
  return spr;
}



function getLocalBoundingBox(obj) {
  if (obj.userData._localBox) return obj.userData._localBox;

  let model = null;
  for (const child of obj.children) {
    if (child.name !== 'dimension-group') { model = child; break; }
  }
  if (!model) return new THREE.Box3();

  obj.updateMatrixWorld(true);
  const box = new THREE.Box3();
  const v = new THREE.Vector3();

  model.traverse(child => {
    if (child.isMesh && child.geometry && child.geometry.attributes.position) {
      const pos = child.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        child.localToWorld(v);
        obj.worldToLocal(v);
        box.expandByPoint(v);
      }
    }
  });

  obj.userData._localBox = box;
  return box;
}

function buildDimensions(obj) {
  const old = obj.getObjectByName('dimension-group');
  if (old) obj.remove(old);

  const type = obj.userData.type;
  const dims = modelDimensions[type];
  if (!dims) return;

  const box = getLocalBoundingBox(obj);
  const off  = 2;
  const tick = 1;
  const col  = 0xB5B8B1;

  const g = new THREE.Group();
  g.name = 'dimension-group';
  g.visible = dimensionsVisible;

  // — Ширина (X): спереди, снизу —
  const wY = box.min.y;
  const wZ = box.max.z + off;
  g.add(makeDimLine(new THREE.Vector3(box.min.x, wY, wZ), new THREE.Vector3(box.max.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.min.x, box.min.y, box.max.z), new THREE.Vector3(box.min.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.max.x, box.min.y, box.max.z), new THREE.Vector3(box.max.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.min.x, wY - tick, wZ), new THREE.Vector3(box.min.x, wY + tick, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.max.x, wY - tick, wZ), new THREE.Vector3(box.max.x, wY + tick, wZ), col));
  const wLabel = makeDimLabel(dims.width);
  wLabel.position.set((box.min.x + box.max.x) / 2, wY, wZ);
  g.add(wLabel);

  // — Глубина (Z): справа, снизу —
  const dY = box.min.y;
  const dX = box.max.x + off;
  g.add(makeDimLine(new THREE.Vector3(dX, dY, box.min.z), new THREE.Vector3(dX, dY, box.max.z), col));
  g.add(makeDimLine(new THREE.Vector3(box.max.x, box.min.y, box.min.z), new THREE.Vector3(dX, dY, box.min.z), col));
  g.add(makeDimLine(new THREE.Vector3(box.max.x, box.min.y, box.max.z), new THREE.Vector3(dX, dY, box.max.z), col));
  g.add(makeDimLine(new THREE.Vector3(dX, dY - tick, box.min.z), new THREE.Vector3(dX, dY + tick, box.min.z), col));
  g.add(makeDimLine(new THREE.Vector3(dX, dY - tick, box.max.z), new THREE.Vector3(dX, dY + tick, box.max.z), col));
  const dLabel = makeDimLabel(dims.depth);
  dLabel.position.set(dX, dY, (box.min.z + box.max.z) / 2);
  g.add(dLabel);

  // — Высота (Y): слева —
  const hX = box.min.x - off;
  const hZ = box.min.z;
  g.add(makeDimLine(new THREE.Vector3(hX, box.min.y, hZ), new THREE.Vector3(hX, box.max.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.min.x, box.min.y, hZ), new THREE.Vector3(hX, box.min.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(box.min.x, box.max.y, hZ), new THREE.Vector3(hX, box.max.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(hX - tick, box.min.y, hZ), new THREE.Vector3(hX + tick, box.min.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(hX - tick, box.max.y, hZ), new THREE.Vector3(hX + tick, box.max.y, hZ), col));
  const hLabel = makeDimLabel(dims.height);   //  const hLabel = makeDimLabel(dims.height + ' см');

  hLabel.position.set(hX, (box.min.y + box.max.y) / 2, hZ);
  g.add(hLabel);

  obj.add(g);
}

function buildTotalDimensions() {
  const old = scene.getObjectByName('total-dimension-group');
  if (old) scene.remove(old);

  if (sceneObjects.length < 2) return;

  // Строим общий бокс из номинальных размеров каждого объекта
  const totalBox = new THREE.Box3();
  sceneObjects.forEach(obj => {
    const box = getNominalObjBox(obj);
    if (!box.isEmpty()) totalBox.union(box);
  });
  if (totalBox.isEmpty()) return;

  // Сырые габариты (в мировых единицах)
  let w = totalBox.max.x - totalBox.min.x;
  let d = totalBox.max.z - totalBox.min.z;
  let h = totalBox.max.y - totalBox.min.y;

  // Округляем до кратного номиналу, если ошибка в пределах допуска.
  // Допуск растёт пропорционально числу секций —
  // каждая привязка добавляет ~20мм зазора от COLLISION_PADDING.
  const STEP = 6.5;           // 650мм в мировых единицах
  const PER_GAP_TOL = 0.25;   // 25мм на каждый стык

  const wSteps = Math.round(w / STEP);
  if (wSteps >= 1 && Math.abs(w - wSteps * STEP) <= PER_GAP_TOL * wSteps) w = wSteps * STEP;

  const dSteps = Math.round(d / STEP);
  if (dSteps >= 1 && Math.abs(d - dSteps * STEP) <= PER_GAP_TOL * dSteps) d = dSteps * STEP;

  // Высота — всегда одна секция (710мм)
  if (Math.abs(h - 7.1) <= PER_GAP_TOL) h = 7.1;

  // --- Отрисовка ---
  const off  = 4;
  const tick = 1;
  const col  = 0x96c22b;

  const g = new THREE.Group();
  g.name = 'total-dimension-group';
  g.visible = dimensionsVisible;

  // Ширина (X)
  const wY = totalBox.min.y;
  const wZ = totalBox.max.z + off;
  g.add(makeDimLine(new THREE.Vector3(totalBox.min.x, wY, wZ), new THREE.Vector3(totalBox.max.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.min.x, totalBox.min.y, totalBox.max.z), new THREE.Vector3(totalBox.min.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.max.x, totalBox.min.y, totalBox.max.z), new THREE.Vector3(totalBox.max.x, wY, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.min.x, wY - tick, wZ), new THREE.Vector3(totalBox.min.x, wY + tick, wZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.max.x, wY - tick, wZ), new THREE.Vector3(totalBox.max.x, wY + tick, wZ), col));
  const wLabel = makeDimLabel(String(Math.round(w * 100)));
  wLabel.position.set((totalBox.min.x + totalBox.max.x) / 2, wY, wZ);
  g.add(wLabel);

  // Глубина (Z)
  const dY = totalBox.min.y;
  const dX = totalBox.max.x + off;
  g.add(makeDimLine(new THREE.Vector3(dX, dY, totalBox.min.z), new THREE.Vector3(dX, dY, totalBox.max.z), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.max.x, totalBox.min.y, totalBox.min.z), new THREE.Vector3(dX, dY, totalBox.min.z), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.max.x, totalBox.min.y, totalBox.max.z), new THREE.Vector3(dX, dY, totalBox.max.z), col));
  g.add(makeDimLine(new THREE.Vector3(dX, dY - tick, totalBox.min.z), new THREE.Vector3(dX, dY + tick, totalBox.min.z), col));
  g.add(makeDimLine(new THREE.Vector3(dX, dY - tick, totalBox.max.z), new THREE.Vector3(dX, dY + tick, totalBox.max.z), col));
  const dLabel = makeDimLabel(String(Math.round(d * 100)));
  dLabel.position.set(dX, dY, (totalBox.min.z + totalBox.max.z) / 2);
  g.add(dLabel);

  // Высота (Y)
  const hX = totalBox.min.x - off;
  const hZ = totalBox.min.z;
  g.add(makeDimLine(new THREE.Vector3(hX, totalBox.min.y, hZ), new THREE.Vector3(hX, totalBox.max.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.min.x, totalBox.min.y, hZ), new THREE.Vector3(hX, totalBox.min.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(totalBox.min.x, totalBox.max.y, hZ), new THREE.Vector3(hX, totalBox.max.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(hX - tick, totalBox.min.y, hZ), new THREE.Vector3(hX + tick, totalBox.min.y, hZ), col));
  g.add(makeDimLine(new THREE.Vector3(hX - tick, totalBox.max.y, hZ), new THREE.Vector3(hX + tick, totalBox.max.y, hZ), col));
  const hLabel = makeDimLabel(String(Math.round(h * 100)));
  hLabel.position.set(hX, (totalBox.min.y + totalBox.max.y) / 2, hZ);
  g.add(hLabel);

  scene.add(g);
}

function setupBackgroundPlane(texture) {
  if (backgroundPlane) {
    scene.remove(backgroundPlane);
    backgroundPlane.geometry.dispose();
    backgroundPlane.material.dispose();
  }

  texture.encoding = THREE.sRGBEncoding;

  const aspect = window.innerWidth / window.innerHeight;
  const planeWidth = 2000;
  const planeHeight = planeWidth / aspect;

  const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  backgroundPlane = new THREE.Mesh(geometry, material);

  // Позиция: перед камерой, за диванами
  backgroundPlane.position.set(0, 0, -500);

  scene.add(backgroundPlane);
  scene.background = null;

  // Применяем сохранённые трансформации
  updateBackgroundTransform();
}

function updateBackgroundTransform() {
  if (!backgroundPlane) return;

  backgroundPlane.scale.set(bgScale, bgScale, bgScale);
  backgroundPlane.position.x = bgOffsetX;
  backgroundPlane.position.z = -500 + bgOffsetZ; // смещение по глубине
}


function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  if (isDragging && selectedObject && transformControls.getMode() === 'translate') {
    snapToNeighbors(selectedObject);
  }

  controls.update();
  renderer.render(scene, camera);
}
