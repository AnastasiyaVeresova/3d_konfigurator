<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Конфигуратор Диванов</title>
<style>
  body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  #ui-panel {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 280px;
     max-height: 90vh; /* Панель не выше 90% высоты экрана */
  overflow-y: auto; /* Вертикальный скролл, если контент не влезает */
  }
  #ui-panel h3 { margin-top: 0; margin-bottom: 15px; color: #333; }
  #ui-panel button, #ui-panel input[type="color"], #ui-panel select {
    margin: 8px 0; width: 100%; padding: 10px; box-sizing: border-box; cursor: pointer;
    border: 1px solid #ddd; border-radius: 6px; background: #fff;
  }
  #ui-panel button { background: #f0f0f0; color: #333; transition: 0.2s; }
  #ui-panel button:hover { background: #e0e0e0; }
  #ui-panel .btn-action { background: #007bff; color: white; }
  #ui-panel .btn-action:hover { background: #0056b3; }

  #ui-panel .btn-row {
    display: flex; gap: 8px;
  }
  #ui-panel .btn-row button { margin: 0; flex: 1; }

  #object-controls {
    display: none;
    position: absolute; top: 10px; right: 10px; z-index: 20;
    background: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 280px;
  }
  #object-controls h3, #object-controls h4 {
    margin-top: 0; margin-bottom: 15px; color: #333;
  }
  #object-controls button,
  #object-controls input[type="color"],
  #object-controls select,
  #object-controls input[type="range"] {
    margin: 8px 0; width: 100%; padding: 10px; box-sizing: border-box;
    cursor: pointer; border: 1px solid #ddd; border-radius: 6px; background: #fff;
  }
  #object-controls button {
    background: #f0f0f0; color: #333; transition: 0.2s;
  }
  #object-controls button:hover { background: #e0e0e0; }
  #object-controls label {
    font-size: 12px; color: #666; display: block; margin-bottom: 4px;
  }
  #object-controls .btn-row {
    display: flex; gap: 8px;
  }
  #object-controls .btn-row button { margin: 0; flex: 1; }
  #object-controls hr {
    margin: 15px 0; border: 0; border-top: 1px solid #ccc;
  }
  #delete-object {
    background: #96C22B !important; color: white !important;
    font-weight: bold;
  }
  #delete-object:hover { background: #7da820 !important; }

  /* Зелёные ползунки */
  #object-controls input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 5px;
    border-radius: 4px;
    background: #96C22B;
    outline: none;
    padding: 0;
  }
  #object-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #96C22B;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  #object-controls input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #96C22B;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  #object-controls input[type="range"]::-moz-range-track {
    height: 5px; border-radius: 4px; background: #96C22B;
  }

  /* Кнопки истории */
  #undo-action, #redo-action {
    background: #f0f0f0; color: #333; transition: 0.2s; font-weight: bold;

  #undo-action:hover { background: #ffcccc; color: #cc0000; }
  #redo-action:hover { background: #ccffcc; color: #006600; }
  .disabled-btn {
    opacity: 0.5; cursor: not-allowed; pointer-events: none;

<script>
let scene, camera, renderer, controls;

const modelsPaths = {
  straight: 'models/Прямая секция.glb',
  corner: 'models/Угловая секция.glb'
};

// Кэш текстур
const textureCache = {};
const textureLoader = new THREE.TextureLoader();

let backgroundPlane = null;
const bgTextureLoader = new THREE.TextureLoader();

// Переменные для трансформации фона
let bgScale = 1.0;
let bgOffsetX = 0;
let bgOffsetZ = 0;


let modelsCache = {};
let modelsLoaded = false;
let modelsToLoad = Object.keys(modelsPaths).length;
let modelsLoadedCount = 0;

let selectedObject = null;
let transformControls;
let currentObject = null;

const SNAP_THRESHOLD = 3.0;
let isDragging = false;

const objectControlsDiv = document.getElementById('object-controls');
const rotYSlider = document.getElementById('rotation-y-slider');
const posYSlider = document.getElementById('position-y-slider');

// ===================================================
// ИСТОРИЯ ДЕЙСТВИЙ
// ===================================================
const historyStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

function saveState() {
  redoStack.length = 0;

  const snapshot = [];
  sceneObjects.forEach(obj => {
    const clone = obj.clone(true);
    if (obj.userData) {
      clone.userData = JSON.parse(JSON.stringify(obj.userData));
    }
    snapshot.push(clone);
  });

  historyStack.push(snapshot);

  if (historyStack.length > MAX_HISTORY) {
    historyStack.shift();
  }

  updateHistoryButtons();
}

function undo() {
  if (historyStack.length < 2) return;

  const currentSnapshot = historyStack.pop();
  const prevSnapshot = historyStack[historyStack.length - 1];

  redoStack.push(currentSnapshot);

  restoreSnapshot(prevSnapshot);
  updateHistoryButtons();
}

function redo() {
  if (redoStack.length === 0) return;

  const nextSnapshot = redoStack.pop();
  historyStack.push(nextSnapshot);

  restoreSnapshot(nextSnapshot);
  updateHistoryButtons();
}

function restoreSnapshot(snapshot) {
  sceneObjects.forEach(obj => scene.remove(obj));
  sceneObjects.length = 0;

  snapshot.forEach(obj => {
    scene.add(obj);
    sceneObjects.push(obj);

    // Восстанавливаем текстуры, т.к. clone() не копирует ссылки на текстуры
    if (obj.userData.upholsteryCategory && obj.userData.upholsteryCategory !== 'none') {
      applyUpholsteryTexture(obj, obj.userData.upholsteryCategory, obj.userData.upholsteryVariant);
    }
  });

  deselectObject();
}


function updateHistoryButtons() {
  const btnUndo = document.getElementById('undo-action');
  const btnRedo = document.getElementById('redo-action');

  if (btnUndo) btnUndo.classList.toggle('disabled-btn', historyStack.length <= 1);
  if (btnRedo) btnRedo.classList.toggle('disabled-btn', redoStack.length === 0);
}

// ===================================================
// УТИЛИТЫ
// ===================================================
function hexStringToNumber(hexStr) {
  return parseInt(hexStr.slice(1), 16);
}

const COLOR_TYPE_RULES = [
  { type: 'upholstery', colors: [0xFFFFFF, 0x393939] },
  { type: 'frame', colors: [0x979797, 0xCACACA] },
];

function assignMeshTypes(model) {
  model.traverse((child) => {
    if (child.isMesh) {
      if (!child.userData) child.userData = {};
      const colorHex = child.material.color.getHex();
      child.userData.originalColor = colorHex;

      let found = false;
      for (const rule of COLOR_TYPE_RULES) {
        if (rule.colors.includes(colorHex)) {
          child.userData.type = rule.type;
          found = true;
          break;
        }
      }
      if (!found) child.userData.type = 'undefined';
    }
  });
}

function changeColorByType(model, type, colorHex) {
  let changedCount = 0;
  model.traverse((child) => {
    if (child.isMesh && child.userData && child.userData.type === type) {
      child.material = child.material.clone();
      if (child.material.map) child.material.map = null;
      child.material.color.setHex(colorHex);
      child.material.metalness = 0;
      child.material.roughness = 0.7;
      child.material.needsUpdate = true;
      changedCount++;
    }
  });
  return changedCount;
}

function updateColorForAllSceneObjects(type, colorHex) {
  sceneObjects.forEach((obj) => {
    changeColorByType(obj, type, colorHex);
  });
}

// ===================================================
// ВЫДЕЛЕНИЕ ОБЪЕКТА
// ===================================================
function highlightObject(object, on) {
  object.traverse((child) => {
    if (child.isMesh) {
      if (on) {
        if (child.userData.origEmissive === undefined) {
          child.userData.origEmissive = child.material.emissive
            ? child.material.emissive.getHex()
            : 0x000000;
        }
        child.material.emissive = new THREE.Color(0x004400);
        child.material.emissiveIntensity = 0.5;
      } else {
        if (child.userData.origEmissive !== undefined) {
          child.material.emissive = new THREE.Color(child.userData.origEmissive);
          child.material.emissiveIntensity = 1;
        }
      }
      child.material.needsUpdate = true;
    }
  });
}

function selectObject(object) {
  if (selectedObject) {
    highlightObject(selectedObject, false);
  }
  selectedObject = object;
  currentObject = object;

  if (object.userData.frameColor) {
    document.getElementById('frame-color').value = object.userData.frameColor;
  }
  if (object.userData.upholsteryColor) {
    document.getElementById('upholstery-color').value = object.userData.upholsteryColor;
  }

  // Восстанавливаем категорию и вариант текстуры
  if (object.userData.upholsteryCategory) {
    document.getElementById('upholstery-category').value = object.userData.upholsteryCategory;
    populateVariants();
    if (object.userData.upholsteryVariant) {
      document.getElementById('upholstery-variant').value = object.userData.upholsteryVariant;
      updateUpholsteryPreview();
    }
  }

  highlightObject(object, true);
  transformControls.attach(object);
  setMode('translate');
  updateSliders();
  objectControlsDiv.style.display = 'block';
}

function deselectObject() {
  if (selectedObject) {
    highlightObject(selectedObject, false);
  }
  selectedObject = null;
  currentObject = null;
  objectControlsDiv.style.display = 'none';
  if (transformControls) transformControls.detach();
}

function setMode(mode) {
  if (transformControls) {
    transformControls.setMode(mode);
  }
}

function updateSliders() {
  if (currentObject) {
    rotYSlider.value = THREE.MathUtils.radToDeg(currentObject.rotation.y).toFixed(0);
    posYSlider.value = currentObject.position.y.toFixed(2);
  }
}

// ===================================================
// ЗАГРУЗКА МОДЕЛЕЙ
// ===================================================
function loadModels() {
  const keys = Object.keys(modelsPaths);
  let loadedCount = 0;

  keys.forEach(key => {
    new THREE.GLTFLoader().load(modelsPaths[key], (gltf) => {
      const sceneModel = gltf.scene;
      assignMeshTypes(sceneModel);
      modelsCache[key] = sceneModel;
      loadedCount++;
      if (loadedCount === keys.length) {
        modelsLoaded = true;
        console.log('✅ Все модели загружены');
        saveState();
      }
    }, undefined, (error) => console.error('Ошибка загрузки модели:', key, error));
  });
}

// ===================================================
// ДОБАВЛЕНИЕ СЕКЦИИ
// ===================================================
function addSection(type) {
  if (!modelsLoaded) {
    alert('Модели ещё не загружены, подождите.');
    return;
  }

  saveState();

  if (!modelsCache[type]) {
    alert('Модель не загрузилась: ' + type);
    return;
  }

  const model = modelsCache[type].clone(true);

  model.traverse((child) => {
    if (child.isMesh) {
      child.material = child.material.clone();
      if (child.material.map) child.material.map = null;
      if (child.material.normalMap) child.material.normalMap = null;
      if (child.material.roughnessMap) child.material.roughnessMap = null;
      if (child.material.metalnessMap) child.material.metalnessMap = null;

      child.material.color.setHex(0xffffff);
      child.material.metalness = 0;
      child.material.roughness = 0.7;
      child.material.emissive = new THREE.Color(0x000000);
      child.material.needsUpdate = true;
      child.userData.originalColor = 0xffffff;
    }
  });

  model.scale.set(10, 10, 10);

  const group = new THREE.Group();
  group.add(model);
  group.position.set(currentXPosition, 0, 0);

  const frameHexStr = document.getElementById('frame-color').value;
  const upholsteryHexStr = document.getElementById('upholstery-color').value;
  const upholsteryCat = document.getElementById('upholstery-category').value;
  const upholsteryVariant = document.getElementById('upholstery-variant').value;

  group.userData = {
    type: type,
    frameColor: frameHexStr,
    upholsteryColor: upholsteryHexStr,
    upholsteryCategory: upholsteryCat,
    upholsteryVariant: upholsteryVariant || ''
  };

  changeColorByType(group, 'frame', hexStringToNumber(frameHexStr));
  changeColorByType(group, 'upholstery', hexStringToNumber(upholsteryHexStr));

  if (upholsteryCat !== 'none' && upholsteryVariant) {
    applyUpholsteryTexture(group, upholsteryCat, upholsteryVariant);
  }


  scene.add(group);
  sceneObjects.push(group);
  currentXPosition += 10;
}

// ===================================================
// КЛИК ПО СЦЕНЕ
// ===================================================
function onMouseClick(event) {
  if (event.target.closest('#ui-panel') || event.target.closest('#object-controls')) return;

  const mouse = new THREE.Vector2(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(sceneObjects, true);

  if (intersects.length > 0) {
    let object = intersects[0].object;
    while (object.parent && !sceneObjects.includes(object)) {
      object = object.parent;
    }
    if (object !== selectedObject) {
      deselectObject();
      selectObject(object);
    }
  } else {
    deselectObject();
  }
}

// ===================================================
// ЭКСПОРТ
// ===================================================
function exportScene() {
  deselectObject();
  const exporter = new THREE.GLTFExporter();
  exporter.parse(scene, (result) => {
    const output = JSON.stringify(result, null, 2);
    const blob = new Blob([output], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scene.gltf';
    a.click();
    URL.revokeObjectURL(url);
  }, { binary: false });
}

function snapToNeighbors(draggedObj) {
  if (!draggedObj) return;
  
  // 1. Получаем реальные габариты (для отрисовки и физики)
  draggedObj.updateMatrixWorld(true);
  const draggedBox = new THREE.Box3().setFromObject(draggedObj);

  // 2. Создаем "внутреннюю" коробку (для логики стыковки)
  // Мы сжимаем коробку со всех сторон на COLLISION_PADDING
  const innerBox = draggedBox.clone();
  innerBox.min.x += COLLISION_PADDING;
  innerBox.max.x -= COLLISION_PADDING;
  innerBox.min.z += COLLISION_PADDING;
  innerBox.max.z -= COLLISION_PADDING;
  
  // Защита от того, чтобы коробка не схлопнулась в точку, если объект очень маленький
  if (innerBox.min.x >= innerBox.max.x) innerBox.min.x = draggedBox.min.x;
  if (innerBox.min.z >= innerBox.max.z) innerBox.min.z = draggedBox.min.z;

  // --- Фаза 1: Выталкивание при пересечении (используем innerBox!) ---
  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);
    
    // Для соседа тоже берем "внутреннюю" коробку, чтобы стыковка была симметричной
    const objBox = new THREE.Box3().setFromObject(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING;
    objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING;
    objInnerBox.max.z -= COLLISION_PADDING;

    // Проверяем пересечение ВНУТРЕННИХ коробок
    const xOv = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    const zOv = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;

    if (xOv && zOv) {
      // Вычисляем силы выталкивания на основе ВНУТРЕННИХ коробок,
      // но двигаем сам объект (draggedObj), у которого геометрия полная.
      const pushR = objInnerBox.max.x - innerBox.min.x;
      const pushL = innerBox.max.x - objInnerBox.min.x;
      const pushF = objInnerBox.max.z - innerBox.min.z;
      const pushB = innerBox.max.z - objInnerBox.min.z;

      const minPush = Math.min(pushR, pushL, pushF, pushB);

      if (minPush === pushR)      draggedObj.position.x += pushR;
      else if (minPush === pushL) draggedObj.position.x -= pushL;
      else if (minPush === pushF) draggedObj.position.z += pushF;
      else                        draggedObj.position.z -= pushB;

      // После движения пересчитываем innerBox, так как позиция изменилась
      draggedObj.updateMatrixWorld(true);
      innerBox.setFromObject(draggedObj);
      innerBox.min.x += COLLISION_PADDING;
      innerBox.max.x -= COLLISION_PADDING;
      innerBox.min.z += COLLISION_PADDING;
      innerBox.max.z -= COLLISION_PADDING;
    }
  });

  // --- Фаза 2: Притяжение по грани (Snap) ---
  let snapX = null, snapZ = null;
  let minDistX = SNAP_THRESHOLD, minDistZ = SNAP_THRESHOLD;

  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);
    
    const objBox = new THREE.Box3().setFromObject(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING;
    objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING;
    objInnerBox.max.z -= COLLISION_PADDING;

    // Логика привязки теперь работает с innerBox
    const zOverlap = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;
    if (zOverlap) {
      const gap1 = objInnerBox.min.x - innerBox.max.x;
      if (gap1 >= 0 && gap1 < minDistX) {
        minDistX = gap1;
        snapX = draggedObj.position.x + gap1;
      }
      const gap2 = innerBox.min.x - objInnerBox.max.x;
      if (gap2 >= 0 && gap2 < minDistX) {
        minDistX = gap2;
        snapX = draggedObj.position.x - gap2;
      }
    }

    const xOverlap = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    if (xOverlap) {
      const gap3 = objInnerBox.min.z - innerBox.max.z;
      if (gap3 >= 0 && gap3 < minDistZ) {
        minDistZ = gap3;
        snapZ = draggedObj.position.z + gap3;
      }
      const gap4 = innerBox.min.z - objInnerBox.max.z;
      if (gap4 >= 0 && gap4 < minDistZ) {
        minDistZ = gap4;
        snapZ = draggedObj.position.z - gap4;
      }
    }
  });

  if (snapX !== null) { 
    draggedObj.position.x = snapX; 
    draggedObj.updateMatrixWorld(true); 
    innerBox.setFromObject(draggedObj); // Обновляем для следующей итерации
    innerBox.min.x += COLLISION_PADDING; innerBox.max.x -= COLLISION_PADDING;
    innerBox.min.z += COLLISION_PADDING; innerBox.max.z -= COLLISION_PADDING;
  }
  if (snapZ !== null) { 
    draggedObj.position.z = snapZ; 
    draggedObj.updateMatrixWorld(true); 
    innerBox.setFromObject(draggedObj);
    innerBox.min.x += COLLISION_PADDING; innerBox.max.x -= COLLISION_PADDING;
    innerBox.min.z += COLLISION_PADDING; innerBox.max.z -= COLLISION_PADDING;
  }

  // --- Фаза 3: Притяжение углов (Corner Snap) ---
  // Здесь тоже используем innerBox для проверки дистанции
  const CORNER_THRESHOLD = SNAP_THRESHOLD;
  let bestCornerDist = CORNER_THRESHOLD;
  let cornerDx = 0, cornerDz = 0;

  const draggedCorners = [
    { x: innerBox.min.x, z: innerBox.min.z },
    { x: innerBox.max.x, z: innerBox.min.z },
    { x: innerBox.min.x, z: innerBox.max.z },
    { x: innerBox.max.x, z: innerBox.max.z }
  ];

  sceneObjects.forEach(obj => {
    if (obj === draggedObj) return;
    obj.updateMatrixWorld(true);
    const objBox = new THREE.Box3().setFromObject(obj);
    const objInnerBox = objBox.clone();
    objInnerBox.min.x += COLLISION_PADDING;
    objInnerBox.max.x -= COLLISION_PADDING;
    objInnerBox.min.z += COLLISION_PADDING;
    objInnerBox.max.z -= COLLISION_PADDING;

    const hasXOverlap = innerBox.min.x < objInnerBox.max.x && innerBox.max.x > objInnerBox.min.x;
    const hasZOverlap = innerBox.min.z < objInnerBox.max.z && innerBox.max.z > objInnerBox.min.z;

    if (hasXOverlap && hasZOverlap) return; 

    const objCorners = [
      { x: objInnerBox.min.x, z: objInnerBox.min.z },
      { x: objInnerBox.max.x, z: objInnerBox.min.z },
      { x: objInnerBox.min.x, z: objInnerBox.max.z },
      { x: objInnerBox.max.x, z: objInnerBox.max.z }
    ];

    draggedCorners.forEach(dc => {
      objCorners.forEach(oc => {
        const dx = oc.x - dc.x;
        const dz = oc.z - dc.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist > 0.01 && dist < bestCornerDist) {
          bestCornerDist = dist;
          cornerDx = dx;
          cornerDz = dz;
        }
      });
    });
  });

  if (bestCornerDist < CORNER_THRESHOLD) {
    draggedObj.position.x += cornerDx;
    draggedObj.position.z += cornerDz;
  }
}



function capturePositions() {
  const positions = {};
  sceneObjects.forEach((obj, i) => {
    positions[i] = {
      x: obj.position.x, y: obj.position.y, z: obj.position.z,
      rx: obj.rotation.x, ry: obj.rotation.y, rz: obj.rotation.z
    };
  });
  return positions;
}

function positionsChanged(beforeState) {
  let changed = false;
  sceneObjects.forEach((obj, i) => {
    const b = beforeState[i];
    if (!b) { changed = true; return; }
    if (obj.position.x !== b.x || obj.position.y !== b.y || obj.position.z !== b.z ||
        obj.rotation.x !== b.rx || obj.rotation.y !== b.ry || obj.rotation.z !== b.rz) {
      changed = true;
    }
  });
  return changed;
}

function exportPNG() {
  deselectObject();

  // 1. Сохраняем состояние фона
  const wasBackgroundPlane = backgroundPlane !== null;
  let tempBgColor = null;

  if (wasBackgroundPlane) {
    // Если есть плоскость-фон, временно убираем её со сцены для чистого рендера (если нужен прозрачный фон)
    // ИЛИ оставляем, если хочешь, чтобы фон попал в картинку.
    // В твоем ТЗ "Экспорт PNG (прозрачный фон)", значит фон сцены нам не нужен в картинке.
    scene.remove(backgroundPlane); 
  } else {
    // Если нет плоскости, запоминаем цвет фона
    tempBgColor = scene.background;
    scene.background = null; // Делаем прозрачным
  }

  // Убираем пол, чтобы был чистый объект
  const floor = scene.children.find(c => c.geometry && c.geometry.type === 'PlaneGeometry');
  let floorVisible = null;
  if (floor) {
    floorVisible = floor.visible;
    floor.visible = false;
  }

  // Рендерим
  renderer.render(scene, camera);
  const dataURL = renderer.domElement.toDataURL('image/png');

  // ВОССТАНАВЛИВАЕМ ВСЁ ОБРАТНО
  if (wasBackgroundPlane) {
    scene.add(backgroundPlane); // Возвращаем плоскость
  } else if (tempBgColor) {
    scene.background = tempBgColor; // Возвращаем цвет
  }

  if (floor) floor.visible = floorVisible;
  
  // Скачиваем
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'sofa-config.png';
  a.click();
}

// Кэш: key = "category/file" -> THREE.Texture
const upholsteryTextureCache = {};

function getUpholsteryTextureKey(category, file) {
  return category + '/' + file;
}

function loadUpholsteryTexture(category, file, onLoad) {
  const key = getUpholsteryTextureKey(category, file);
  if (upholsteryTextureCache[key]) {
    onLoad(upholsteryTextureCache[key]);
    return;
  }

  textureLoader.load(file, (tex) => {
    // 1. Включаем повторение
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;

    //     tex.wrapS = THREE.MirroredRepeatWrapping;
    // tex.wrapT = THREE.MirroredRepeatWrapping;

    
    // 2. Увеличиваем повтор (рисунок мельче)
    tex.repeat.set(20, 20); 

    // 3. ГЛАВНОЕ: Размываем края текстуры, чтобы скрыть швы
    blurTextureEdges(tex, 20); // 10px - ширина размытия (от 5 до 20)

    // 4. Настройки для четкости и сглаживания
    // tex.encoding = THREE.sRGBEncoding;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter; // Лучший фильтр для повторов
    tex.magFilter = THREE.LinearFilter;            // Сглаживание при увеличении
    tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 16; // Четкость под углом

    upholsteryTextureCache[key] = tex;
    console.log('✅ Текстура загружена и обработана:', key);
    onLoad(tex);
  }, undefined, (err) => {
    console.warn('⚠️ Ошибка загрузки текстуры:', file);
    // Создаем серую заглушку с шумом, тоже с размытием
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 500; i++) {
      const x = Math.random() * 256; const y = Math.random() * 256;
      ctx.fillStyle = `rgb(180,180,180)`; ctx.fillRect(x, y, 4, 4);
    }
    const fallback = new THREE.CanvasTexture(canvas);
    fallback.wrapS = THREE.RepeatWrapping; fallback.wrapT = THREE.RepeatWrapping;
    fallback.repeat.set(20, 20);
    blurTextureEdges(fallback, 10); // Применяем размытие и к заглушке
    fallback.generateMipmaps = true; fallback.minFilter = THREE.LinearMipmapLinearFilter;
    upholsteryTextureCache[key] = fallback;
    onLoad(fallback);
  });
}

function blurTextureEdges(texture, pixelRadius = 40) {
  const img = texture.image;
  if (!img) return;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  // Используем реальные размеры картинки
  canvas.width = img.width || img.naturalWidth || 256;
  canvas.height = img.height || img.naturalHeight || 256;
  
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  let imageData;
  try {
    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } catch (e) {
    console.warn('⚠️ Не удалось обработать текстуру (CORS):', e);
    return;
  }

  const src = new Uint8ClampedArray(imageData.data);
  const d = imageData.data;
  const w = canvas.width;
  const h = canvas.height;

  // Smoothstep для плавного перехода вместо линейного
  function smoothstep(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
  }

  // --- Горизонтальная склейка: левый край ↔ правый край ---
  for (let y = 0; y < h; y++) {
    // Левый край (от 0 до pixelRadius)
    for (let x = 0; x < pixelRadius && x < w; x++) {
      const idx = (y * w + x) * 4;
      const mirrorX = w - 1 - x;
      const mIdx = (y * w + mirrorX) * 4;
      // t = 0 у края, 1 в центре зоны перехода
      const t = 1 - smoothstep(x / pixelRadius);

      d[idx]     = src[idx]     * (1 - t) + src[mIdx]     * t;
      d[idx + 1] = src[idx + 1] * (1 - t) + src[mIdx + 1] * t;
      d[idx + 2] = src[idx + 2] * (1 - t) + src[mIdx + 2] * t;
    }

    // Правый край (от w - pixelRadius до w)
    for (let x = w - pixelRadius; x < w; x++) {
      if (x < pixelRadius) continue; // Чтобы не дублировать обработку центральной зоны
      const idx = (y * w + x) * 4;
      const mirrorX = w - 1 - x;
      const mIdx = (y * w + mirrorX) * 4;
      const t = 1 - smoothstep((w - 1 - x) / pixelRadius);

      d[idx]     = src[idx]     * (1 - t) + src[mIdx]     * t;
      d[idx + 1] = src[idx + 1] * (1 - t) + src[mIdx + 1] * t;
      d[idx + 2] = src[idx + 2] * (1 - t) + src[mIdx + 2] * t;
    }
  }

  // Сохраняем промежуточный результат, чтобы вертикальный проход не смешивал уже смешанные пиксели
  const src2 = new Uint8ClampedArray(d);

  // --- Вертикальная склейка: верхний край ↔ нижний край ---
  for (let x = 0; x < w; x++) {
    // Верхний край
    for (let y = 0; y < pixelRadius && y < h; y++) {
      const idx = (y * w + x) * 4;
      const mirrorY = h - 1 - y;
      const mIdx = (mirrorY * w + x) * 4;
      const t = 1 - smoothstep(y / pixelRadius);

      d[idx]     = src2[idx]     * (1 - t) + src2[mIdx]     * t;
      d[idx + 1] = src2[idx + 1] * (1 - t) + src2[mIdx + 1] * t;
      d[idx + 2] = src2[idx + 2] * (1 - t) + src2[mIdx + 2] * t;
    }

    // Нижний край
    for (let y = h - pixelRadius; y < h; y++) {
      if (y < pixelRadius) continue;
      const idx = (y * w + x) * 4;
      const mirrorY = h - 1 - y;
      const mIdx = (mirrorY * w + x) * 4;
      const t = 1 - smoothstep((h - 1 - y) / pixelRadius);

      d[idx]     = src2[idx]     * (1 - t) + src2[mIdx]     * t;
      d[idx + 1] = src2[idx + 1] * (1 - t) + src2[mIdx + 1] * t;
      d[idx + 2] = src2[idx + 2] * (1 - t) + src2[mIdx + 2] * t;
    }
  }

  ctx.putImageData(imageData, 0, 0);
  texture.image = canvas;
  texture.needsUpdate = true;
}


// Применить текстуру на обивку объекта
function applyUpholsteryTexture(object, category, file) {
  if (category === 'none' || !file) {
    object.traverse((child) => {
      if (child.isMesh && child.userData && child.userData.type === 'upholstery') {
        child.material.map = null;
        child.material.needsUpdate = true;
      }
    });
    return;
  }

  loadUpholsteryTexture(category, file, (texture) => {
    object.traverse((child) => {
      if (child.isMesh && child.userData && child.userData.type === 'upholstery') {
        child.material.map = texture;
        child.material.needsUpdate = true;
      }
    });
  });
}

// Применить текстуру ко всем объектам сцены
function applyUpholsteryTextureToAll(category, file) {
  sceneObjects.forEach(obj => applyUpholsteryTexture(obj, category, file));
}

// ===================================================
// СВЯЗАННЫЕ ВЫПАДАЮЩИЕ СПИСКИ
// ===================================================
function populateVariants() {
  const categorySelect = document.getElementById('upholstery-category');
  const variantSelect = document.getElementById('upholstery-variant');
  const preview = document.getElementById('upholstery-preview');

  const cat = categorySelect.value;

  // Очищаем
  variantSelect.innerHTML = '';

  if (cat === 'none') {
    variantSelect.style.display = 'none';
    preview.style.display = 'none';
    return;
  }

  const data = upholsteryCatalog[cat];
  if (!data) return;

  variantSelect.style.display = 'block';

  data.textures.forEach((tex, i) => {
    const opt = document.createElement('option');
    opt.value = tex.file;
    opt.textContent = tex.name;
    variantSelect.appendChild(opt);
  });

  // Превью первого варианта
  updateUpholsteryPreview();
}

function updateUpholsteryPreview() {
  const variantSelect = document.getElementById('upholstery-variant');
  const preview = document.getElementById('upholstery-preview');
  const file = variantSelect.value;

  if (file) {
    preview.src = file;
    preview.style.display = 'block';
    preview.onerror = () => { preview.style.display = 'none'; };
  } else {
    preview.style.display = 'none';
  }
}

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcccccc);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
  camera.position.set(0, 50, 100);
  camera.lookAt(0, 0, 0);

  renderer.setSize(window.innerWidth, window.innerHeight);

  transformControls = new THREE.TransformControls(camera, renderer.domElement);
  scene.add(transformControls);

  let preDragState = null;
  transformControls.addEventListener('change', () => {
    renderer.render(scene, camera);
    updateSliders();
  });
  transformControls.addEventListener('dragging-changed', (event) => {
    controls.enabled = !event.value;
    isDragging = event.value;

    if (isDragging) {
      preDragState = capturePositions();
    } else {
      if (selectedObject && transformControls.getMode() === 'translate') {
        snapToNeighbors(selectedObject);
        updateSliders();
      }
      if (preDragState && positionsChanged(preDragState)) {
        saveState();
      }
      preDragState = null;

      redo();

  document.getElementById('redo-action').onclick = redo;
  updateHistoryButtons();

    }

      selectedObject.userData.frameColor = '#888888';
      changeColorByType(selectedObject, 'frame', colorHex);
    } else {
      saveState();
      updateColorForAllSceneObjects('frame', colorHex);
    }
  };

  document.getElementById('frame-color').oninput = (e) => {
    const hexStr = e.target.value;
    const hexNum = hexStringToNumber(hexStr);
    if (selectedObject) {
      selectedObject.userData.frameColor = hexStr;
      changeColorByType(selectedObject, 'frame', hexNum);

    }
  };

  // Цвет обивки

    if (selectedObject) {

  document.getElementById('upholstery-category').onchange = () => {

    } else {

document.getElementById('bg-move-right').onclick = () => {
  bgOffsetX += moveStep;
  updateBackgroundTransform();

    reader.onload = (event) => {
      const dataUrl = event.target.result;
      
      // Создаем или обновляем текстуру
      const texture = bgTextureLoader.load(dataUrl, (tex) => {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        // Важно: отключаем фильтрацию, если картинка маленькая, иначе будет мыльно
        tex.minFilter = THREE.LinearFilter; 
        
        setupBackgroundPlane(tex);
      });
    };

    scene.remove(backgroundPlane);
    backgroundPlane.geometry.dispose();
    backgroundPlane.material.dispose();
    backgroundPlane = null;
  }
  // Сброс параметров

  bgOffsetX = 0;
  bgOffsetZ = 0;
  scene.background = new THREE.Color(0xcccccc);
};

  const floor = scene.children.find(c => c.geometry && c.geometry.type === 'PlaneGeometry');
  if (floor) {
    floor.visible = !floor.visible;
  }
};

  // Экспорт
  document.getElementById('export-model').onclick = exportScene;
  document.getElementById('export-png').onclick = exportPNG;
}

function setupBackgroundPlane(texture) {
  if (backgroundPlane) {
    scene.remove(backgroundPlane);
    backgroundPlane.geometry.dispose();
    backgroundPlane.material.dispose();
  }

  texture.encoding = THREE.sRGBEncoding;

  const aspect = window.innerWidth / window.innerHeight;
  const planeWidth = 2000;
  const planeHeight = planeWidth / aspect;

  const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  backgroundPlane = new THREE.Mesh(geometry, material);

  // Позиция: перед камерой, за диванами
  backgroundPlane.position.set(0, 0, -500);

  scene.add(backgroundPlane);
  scene.background = null;

  // Применяем сохранённые трансформации
  updateBackgroundTransform();
}

function updateBackgroundTransform() {
  if (!backgroundPlane) return;

  backgroundPlane.scale.set(bgScale, bgScale, bgScale);
  backgroundPlane.position.x = bgOffsetX;
  backgroundPlane.position.z = -500 + bgOffsetZ; // смещение по глубине
}


function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  if (isDragging && selectedObject && transformControls.getMode() === 'translate') {
    snapToNeighbors(selectedObject);
  }

  controls.update();
  renderer.render(scene, camera);
}

init();
animate();
